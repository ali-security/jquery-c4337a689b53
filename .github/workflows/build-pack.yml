name: build-pack

# Builds dist/ from src/ and packs the npm tarball. Tests run on Travis (.travis.yml).
on:
  workflow_dispatch:

jobs:
  build-pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      # Node 0.10.10 bundles npm 1.2.25, the npm that packed the public tarball
      NODE_VERSION: v0.10.10
      TIME_MACHINE_REGISTRY: https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/
    steps:
      - uses: actions/checkout@v4

      - name: Install Node ${{ env.NODE_VERSION }}
        run: |
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/node-${NODE_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime

      - name: Install dependencies
        # Node 0.10.10's CA bundle predates the registry's certificate chain
        run: |
          node --version
          npm --version
          npm install --registry="$TIME_MACHINE_REGISTRY" --strict-ssl=false

      - name: Build dist
        # faketime pins the build stamps (banner year, @DATE) to the 2014 release
        run: TZ=UTC faketime '2014-05-01 17:42:00' ./node_modules/.bin/grunt 'build:*:*' uglify 'dist:*'

      - name: Generate dist/cdn copies
        run: node .github/ci/cdn-copies.js

      - name: Pack
        # .npmignore does not list .github; drop it so npm 1.2.25 keeps it out of the tarball
        run: |
          rm -rf .github
          npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: jquery-*.tgz
          if-no-files-found: error
